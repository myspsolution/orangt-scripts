# /etc/nginx/sites-available/elearning.banksulselbar.co.id.conf
server {
  listen 80;

  server_name elearning.banksulselbar.co.id;

  root /var/www/html/elearning.banksulselbar.co.id/public;

  include /etc/nginx/snippets/sps/custom-error-pages.conf;

  client_max_body_size 1024M;

  index index.php index.html;

  # bad/banned user agent
  # if ($http_user_agent ~* (curl|wget|python) ) {
  #  return 403;
  # }

  # web access log
  access_log /var/log/nginx/elearning.banksulselbar.co.id.access.log;
  error_log /var/log/nginx/elearning.banksulselbar.co.id.error.log;

  # security headers
  # add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header X-XSS-Protection          "1; mode=block" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "no-referrer-when-downgrade" always;

  location / {
    # enable CORS for API access (laravel backend)

    try_files $uri $uri/ /index.php?$query_string;
  }

  # . (dot) files, only allow access to .well-known/ folder
    location ~ /\.(?!well-known) {
    deny all;
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
  }

  location = /robots.txt  {
    access_log off;
    log_not_found off;
  }

  # assets, media
  location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv)$ {
    expires    1d;
    access_log off;
  }

  # svg, fonts
  location ~* \.(?:svgz?|ttf|ttc|otf|eot|woff2?)$ {
    add_header Access-Control-Allow-Origin "*";
    expires    7d;
    access_log off;
  }

  # add protection from nginx common security problem
  include /etc/nginx/snippets/sps/security.common.conf;

  # handle patch traversal security
  include /etc/nginx/snippets/sps/security.path-traversal.conf;

  # handle .php
  location ~ \.php$ {
    fastcgi_pass 127.0.0.1:9000;

    try_files $uri =404;
    include fastcgi_params;

    fastcgi_index       index.php;
    # fastcgi_buffers     8 16k;
    # fastcgi_buffer_size 32k;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 3600;
  }
}
